# Tutti striped local-NVMe Runtime for accelerator 1. Both accelerator
# Runtimes independently acquire daemon devices 0 and 1.
accelerator:
  profile: CUDA

runtime:
  accel_id: 1

storage:
  resources:
    - id: multi-accelerator-striped-nvme
      type: nvme
      provider:
        type: nvme-service
        endpoint: "127.0.0.1:50051"
      allocation:
        selection: device-group
        device_ids: [0, 1]
        queues_per_controller: 16

  resolvers:
    - id: multi-accelerator-striped-file-resolver
      type: local-file
      scheme: file
      config: {}

  datapaths:
    - id: multi-accelerator-nvme-device-group-datapath
      type: nvme-device-group
      config:
        max_in_flight_operations: 0
        max_batch_entries: 0

  backends:
    - id: multi-accelerator-striped-storage
      contract: nvme-device-group
      resolver: multi-accelerator-striped-file-resolver
      datapath: multi-accelerator-nvme-device-group-datapath
      resource: multi-accelerator-striped-nvme
      config: {}
