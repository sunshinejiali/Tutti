# ============================================================================
# tutti_daemon #2 of 2 -- the host's md0, adopted in place.
#
#   md0 = existing md RAID0 over NVMe d2/df/86/c5:00.0 (NUMA 1; each shares a
#         PCIe switch with GPU 4-7), XFS, 512K chunk, /mnt/nvme4 (models,
#         datasets, docker data-root). The daemon re-assembles the SAME
#         superblocks over the members' snvme block devices; nothing on disk
#         is rewritten. Array name "tutti1" is only the /dev/md/<name> node
#         used while assembling; the kernel keeps md0.
#
# Devices are identified by pci_addr only (block/chrdev numbers depend on
# bring-up order).
#
# Do not start this file by hand: use scripts/tutti-md.sh md0 up|down|status. It
# hands md0 over from the kernel nvme driver, supervises this daemon, and on
# any failure or daemon exit (including a crash) returns NVMe 4-7 to the
# kernel nvme driver and md0 to its fstab mount.
# ============================================================================

grpc: {endpoint: '127.0.0.1:50052'}
accelerators:
- {accel_id: 0, view_root: /mnt/gpu0}
- {accel_id: 1, view_root: /mnt/gpu1}
- {accel_id: 2, view_root: /mnt/gpu2}
- {accel_id: 3, view_root: /mnt/gpu3}
- {accel_id: 4, view_root: /mnt/gpu4}
- {accel_id: 5, view_root: /mnt/gpu5}
- {accel_id: 6, view_root: /mnt/gpu6}
- {accel_id: 7, view_root: /mnt/gpu7}
nvmes:
- device_id: 4
  pci_addr: "0000:d2:00.0"
  backing_mount_path: /mnt/nvme4
  namespace_id: 1
  kernel_ioq_cap: 16
  allowed_accel_ids: [0, 1, 2, 3, 4, 5, 6, 7]
  auto_mount: false
- device_id: 5
  pci_addr: "0000:df:00.0"
  backing_mount_path: /mnt/nvme4
  namespace_id: 1
  kernel_ioq_cap: 16
  allowed_accel_ids: [0, 1, 2, 3, 4, 5, 6, 7]
  auto_mount: false
- device_id: 6
  pci_addr: "0000:86:00.0"
  backing_mount_path: /mnt/nvme4
  namespace_id: 1
  kernel_ioq_cap: 16
  allowed_accel_ids: [0, 1, 2, 3, 4, 5, 6, 7]
  auto_mount: false
- device_id: 7
  pci_addr: "0000:c5:00.0"
  backing_mount_path: /mnt/nvme4
  namespace_id: 1
  kernel_ioq_cap: 16
  allowed_accel_ids: [0, 1, 2, 3, 4, 5, 6, 7]
  auto_mount: false
raid0_arrays:
- name: tutti1
  device_ids: [4, 5, 6, 7]
  mount_path: /mnt/nvme4
  auto_mount: true
queue_pool: {default_per_client: 16, max_per_client: 32}
lease: {heartbeat_interval_sec: 10, timeout_sec: 30}
unmount_retry: {interval_ms: 1000, max: 30}
