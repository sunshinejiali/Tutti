# storage_runtime/local_nvme.yaml -- native TuttiRuntimeSpec single-NVMe graph.
# Not a Python connector config; pass this file explicitly to the native runtime.
# PRP cache is automatically budgeted; handle caches are not application knobs.
# See config/README.md before changing admission budgets.
#
# This file describes one logical storage backend. Deployment facts such as
# PCI BDFs, device paths, BAR sizes, mounts, and actual queue grants belong to
# the daemon configuration and are returned by nvmeservice at allocation time.

accelerator:
  profile: CUDA

runtime:
  accel_id: 0

storage:
  resources:
    - id: nvme-local-0
      type: nvme
      provider:
        type: nvme-service
        endpoint: "127.0.0.1:50051"
      allocation:
        selection: explicit
        device_ids: [0]
        queues_per_controller: 4

  resolvers:
    - id: file-resolver-0
      type: local-file
      scheme: file
      config: {}

  datapaths:
    - id: local-nvme-datapath-0
      type: local-nvme
      config: {}  # 无模型调用使用有限默认：16 operations / 256 entries

  backends:
    - id: model-storage
      contract: ext4-local-nvme
      resolver: file-resolver-0
      datapath: local-nvme-datapath-0
      resource: nvme-local-0
      config: {}
