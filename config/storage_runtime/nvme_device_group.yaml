# NVMe设备组：一次提交使用整个控制器集合，不代表阵列类型。
# 独立挂载点由resolver分派；共享md挂载点仍核验阵列。默认用户用raid0.yaml。
# Adjust endpoint/device IDs after reviewing config/local/tutti_daemon_<name>.yaml.
# This file does not configure a Python connector or create/rebuild an array.
accelerator:
  profile: CUDA
runtime:
  accel_id: 0
storage:
  resources:
    - id: nvme-group
      type: nvme
      provider:
        type: nvme-service
        endpoint: "127.0.0.1:50051"
      allocation:
        selection: device-group
        device_ids: [0, 1]
        queues_per_controller: 4
  resolvers:
    - id: file-resolver
      type: local-file
      scheme: file
      config: {}
  datapaths:
    - id: nvme-device-group-datapath
      type: nvme-device-group
      config: {}  # 无模型调用默认16/256；已知大批次可显式覆盖内部预算
  backends:
    - id: nvme-device-group-storage
      contract: nvme-device-group
      resolver: file-resolver
      datapath: nvme-device-group-datapath
      resource: nvme-group
      config: {}
